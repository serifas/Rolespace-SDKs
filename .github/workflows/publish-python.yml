name: Publish Python SDK

# Fires when you push a tag like py-v0.1.0. Uses PyPI trusted publishers (OIDC)
# — no PYPI_API_TOKEN needed once you've configured the trusted publisher on
# pypi.org pointing at this repo + workflow file + environment `pypi`.
#
# Trusted publisher config (one-time, on pypi.org → your project → Publishing):
#   Owner:           rolespace
#   Repository:      rolespace-sdks
#   Workflow:        publish-python.yml
#   Environment:     pypi
on:
    push:
        tags:
            - 'py-v*'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Sanity-check tag vs pyproject.toml
              working-directory: python
              run: |
                  TAG="${GITHUB_REF_NAME#py-v}"
                  PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
                  if [ "$TAG" != "$PKG" ]; then
                      echo "Tag version ($TAG) does not match pyproject.toml version ($PKG)" >&2
                      exit 1
                  fi

            - name: Install build tools
              run: python -m pip install --upgrade build

            - name: Build sdist + wheel
              working-directory: python
              run: python -m build

            - uses: actions/upload-artifact@v4
              with:
                  name: python-dist
                  path: python/dist/

    publish:
        needs: build
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write   # required for PyPI trusted publishing
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: python-dist
                  path: dist/

            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: dist/
